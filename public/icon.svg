<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glow effect -->
  <circle cx="256" cy="240" r="140" fill="#10b981" opacity="0.15" filter="blur(40px)"/>

  <!-- Main Scales of Justice & Plant Shield Icon -->
  <g filter="url(#shadow)">
    <!-- Shield Outline -->
    <path d="M256 90 L380 145 C380 270 256 365 256 365 C256 365 132 270 132 145 Z" 
          fill="#0b1329" stroke="url(#leafGrad)" stroke-width="10" stroke-linejoin="round"/>

    <!-- Sprout / Wheat Leaves in Center -->
    <!-- Left Leaf -->
    <path d="M256 280 C210 260 190 200 205 165 C230 190 250 225 256 280 Z" 
          fill="url(#leafGrad)"/>
    <!-- Right Leaf -->
    <path d="M256 280 C302 260 322 200 307 165 C282 190 262 225 256 280 Z" 
          fill="url(#leafGrad)" opacity="0.9"/>
    <!-- Center Stem -->
    <path d="M256 305 L256 160" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Balance Bar (HMK / Justice reference) -->
    <line x1="180" y1="185" x2="332" y2="185" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="185" r="7" fill="#fbbf24"/>

    <!-- Left Pan -->
    <line x1="195" y1="185" x2="175" y2="225" stroke="#fbbf24" stroke-width="3"/>
    <line x1="195" y1="185" x2="215" y2="225" stroke="#fbbf24" stroke-width="3"/>
    <path d="M165 225 Q195 240 225 225 Z" fill="#fbbf24"/>

    <!-- Right Pan -->
    <line x1="317" y1="185" x2="297" y2="225" stroke="#fbbf24" stroke-width="3"/>
    <line x1="317" y1="185" x2="337" y2="225" stroke="#fbbf24" stroke-width="3"/>
    <path d="M287 225 Q317 240 347 225 Z" fill="#fbbf24"/>
  </g>

  <!-- Star accents -->
  <polygon points="256,120 261,133 275,133 264,142 268,155 256,146 244,155 248,142 237,133 251,133" fill="#fbbf24"/>

  <!-- Text Badge at Bottom -->
  <rect x="146" y="405" width="220" height="42" rx="21" fill="#10b981" opacity="0.2"/>
  <rect x="146" y="405" width="220" height="42" rx="21" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="3">01 TARIM • 02</text>
</svg>
